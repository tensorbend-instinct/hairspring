[package]
name = "hairspring-desktop"
version = "0.1.0"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hs-loop = { path = "../../../crates/hs-loop" }
dirs = "5"

[profile.release]
debug = 0
opt-level = "s"
lto = false
codegen-units = 16
strip = true
