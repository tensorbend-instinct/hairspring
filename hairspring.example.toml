# HAIRSPRING rig for hs-repl: tools + models the loop can use.
#
# install.sh writes a copy of this file to
# ~/.config/hairspring/hairspring.toml with @PREFIX@ replaced by the
# real install prefix - edit that copy, not this template.
#
# The REPL serves the terminal surface: term.exec runs commands on the
# live machine (state persists), repo.read/repo.search inspect the
# workdir, notes.scratch holds durable notes, answer.submit finishes.
# checker.run is the BLIND self-check rig, triggered by answer.submit
# (the model never calls it directly): the agent declares its own
# verification commands, one per line, in .hs/checks in the workdir,
# and the checker is green only when every one passes. No ground truth
# enters the mission.
#
# Required env for live models:
#   HS_DEEPSEEK_API_KEY       - DeepSeek API key
#     (or HS_DEEPSEEK_API_KEY_FILE pointing at a file holding the key)

[[tools]]
name = "term.exec"
command = ["@PREFIX@/bin/hs-plugin-termexec"]
subjects = ["*"]

[[tools]]
name = "repo.read"
command = ["@PREFIX@/bin/hs-plugin-fileread"]
subjects = ["*"]

[[tools]]
name = "repo.search"
command = ["@PREFIX@/bin/hs-plugin-reposearch"]
subjects = ["*"]

[[tools]]
name = "notes.scratch"
command = ["@PREFIX@/bin/hs-plugin-notescratch"]
subjects = ["*"]

[[tools]]
name = "answer.submit"
command = ["@PREFIX@/bin/hs-plugin-answersubmit"]
subjects = ["*"]

[[tools]]
name = "checker.run"
command = ["@PREFIX@/bin/hs-plugin-selfcheck"]
subjects = ["*"]

# Async sub-agent delegation: agent.spawn returns immediately, children
# run concurrently, agent.spawn_poll reports their outcomes.
[[tools]]
name = "agent.spawn"
command = ["@PREFIX@/bin/hs-plugin-swarm"]
subjects = ["*"]

[[tools]]
name = "agent.spawn_poll"
command = ["@PREFIX@/bin/hs-plugin-swarm", "--as", "agent.spawn_poll"]
subjects = ["*"]

[[models]]
name = "deepseek"
command = ["@PREFIX@/bin/hs-plugin-deepseek"]
default = true
subjects = ["*"]

# Offline model for a zero-network trial: replays a fixed script, then
# answers. To try the loop with no API key:
#   1. export HS_SEQMODEL_SCRIPT=@PREFIX@/seqmodel-demo.jsonl
#      (installed by install.sh; the script pairs with this exact run:
#      hairspring run --goal "write hello.txt containing hello" \
#          --config <this file> --dir /tmp/hs-demo)
#   2. comment out `default = true` on the deepseek model above and
#      uncomment the line below.
# Without HS_SEQMODEL_SCRIPT the model stays inert: missions that call it
# get an error naming the variable, other models are unaffected.
[[models]]
name = "scripted"
command = ["@PREFIX@/bin/hs-plugin-scripted"]
# default = true
subjects = ["*"]
