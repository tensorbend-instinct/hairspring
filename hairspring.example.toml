# HAIRSPRING rig for hs-repl: tools + models the loop can use.
#
# install.sh writes a copy of this file to
# ~/.config/hairspring/hairspring.toml with @PREFIX@ replaced by the
# real install prefix - edit that copy, not this template.
#
# Required env for live models:
#   HS_DEEPSEEK_API_KEY       - DeepSeek API key
#   HS_SWE_WORKSPACE          - repo checkout the agent may work on
#     (or HS_DEEPSEEK_API_KEY_FILE pointing at a file holding the key)
#
# checker.run is the BLIND self-check rig: the agent declares its own
# verification commands (.hs/checks in its candidate) and the checker is
# green only when every one passes. No ground truth enters the mission.

[[tools]]
name = "answer.write"
command = ["@PREFIX@/bin/hs-plugin-answer"]
subjects = ["*"]

[[tools]]
name = "answer.submit"
command = ["@PREFIX@/bin/hs-plugin-answersubmit"]
subjects = ["*"]

[[tools]]
name = "checker.run"
command = ["@PREFIX@/bin/hs-plugin-selfcheck"]
subjects = ["*"]

[[tools]]
name = "repo.read"
command = ["@PREFIX@/bin/hs-plugin-fileread"]
subjects = ["*"]

[[tools]]
name = "repo.search"
command = ["@PREFIX@/bin/hs-plugin-reposearch"]
subjects = ["*"]

[[tools]]
name = "repo.exec"
command = ["@PREFIX@/bin/hs-plugin-repoexec"]
subjects = ["*"]

[[tools]]
name = "edit.apply"
command = ["@PREFIX@/bin/hs-plugin-editapply"]
subjects = ["*"]

[[tools]]
name = "notes.scratch"
command = ["@PREFIX@/bin/hs-plugin-notescratch"]
subjects = ["*"]

# Async sub-agent delegation: agent.spawn returns immediately, children
# run concurrently, agent.spawn_poll reports their outcomes.
[[tools]]
name = "agent.spawn"
command = ["@PREFIX@/bin/hs-plugin-swarm"]
subjects = ["*"]

[[tools]]
name = "agent.spawn_poll"
command = ["@PREFIX@/bin/hs-plugin-swarm", "--as", "agent.spawn_poll"]
subjects = ["*"]

[[models]]
name = "deepseek"
command = ["@PREFIX@/bin/hs-plugin-deepseek"]
default = true
subjects = ["*"]

# Offline model for a zero-network trial: replays a fixed script, then
# answers. Uncomment default here (and comment it above) to try the loop
# with no API key.
[[models]]
name = "scripted"
command = ["@PREFIX@/bin/hs-plugin-scripted"]
subjects = ["*"]
