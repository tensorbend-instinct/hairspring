# HAIRSPRING rig for hs-repl: tools + models the loop can use.
#
# install.sh writes a copy of this file to
# ~/.config/hairspring/hairspring.toml with @PREFIX@ replaced by the
# real install prefix - edit that copy, not this template.
#
# The REPL serves the terminal surface: term.exec runs commands on the
# live machine (state persists), repo.read/repo.search inspect the
# workdir, notes.scratch holds durable notes, answer.submit finishes.
# checker.run is the mission's stop authority, triggered by
# answer.submit (the model never calls it directly). It has TWO phases:
# phase 1 re-runs the agent's declared checks (.hs/checks in the
# workdir - green when the checks pass); phase 2 is an
# INDEPENDENT critic - a fresh model context that never saw the
# session, given the mission instruction (the REPL writes it to
# .hs/instruction.txt at mission start) and read-only shell access,
# with one directive: REFUTE the submission. The critic model is
# HS_CRITIC_MODEL (default "deepseek"); its caps are
# HS_CRITIC_MAX_STEPS / HS_CRITIC_WALL_SECS / HS_CRITIC_BUDGET_MICROS
# (defaults 12 / 600 / $1.00, an abnormal exit fails closed).
# To run the old blind rig (declared checks only), point checker.run
# at @PREFIX@/bin/hs-plugin-selfcheck instead.
#
# Required env for live models:
#   HS_DEEPSEEK_API_KEY       - DeepSeek API key
#     (or HS_DEEPSEEK_API_KEY_FILE pointing at a file holding the key)

[[tools]]
name = "term.exec"
command = ["@PREFIX@/bin/hs-plugin-termexec"]
subjects = ["*"]

[[tools]]
name = "repo.read"
command = ["@PREFIX@/bin/hs-plugin-fileread"]
subjects = ["*"]

[[tools]]
name = "repo.search"
command = ["@PREFIX@/bin/hs-plugin-reposearch"]
subjects = ["*"]

[[tools]]
name = "notes.scratch"
command = ["@PREFIX@/bin/hs-plugin-notescratch"]
subjects = ["*"]

[[tools]]
name = "answer.submit"
command = ["@PREFIX@/bin/hs-plugin-answersubmit"]
subjects = ["*"]

[[tools]]
name = "checker.run"
command = ["@PREFIX@/bin/hs-plugin-critic"]
subjects = ["*"]

# Async sub-agent delegation: agent.spawn returns immediately, children
# run concurrently, agent.spawn_poll reports their outcomes.
[[tools]]
name = "agent.spawn"
command = ["@PREFIX@/bin/hs-plugin-swarm"]
subjects = ["*"]

[[tools]]
name = "agent.spawn_poll"
command = ["@PREFIX@/bin/hs-plugin-swarm", "--as", "agent.spawn_poll"]
subjects = ["*"]

[[models]]
name = "deepseek"
command = ["@PREFIX@/bin/hs-plugin-deepseek"]
default = true
subjects = ["*"]

# Any OpenAI-compatible endpoint (OpenRouter, OpenAI direct, local) is a
# providers.toml entry + one [[models]] block on the generic plugin. The
# TUI writes both for you (/models add); by hand, see docs/providers.md.
# Example (uncomment, then /models in the TUI):
# [[models]]
# name = "openrouter"
# command = ["@PREFIX@/bin/hs-plugin-provmodel", "openrouter"]
# subjects = ["*"]

# Offline model for a zero-network trial: replays a fixed script, then
# answers. To try the loop with no API key:
#   1. export HS_SEQMODEL_SCRIPT=@PREFIX@/seqmodel-demo.jsonl
#      export HS_SCRIPTED_PROMPT_AWARE=1   (answers the verifier audit
#      honestly - without it the demo closes verifier_malfunction)
#      export HS_CRITIC_SCRIPT='tool:grep -q hello hello.txt|clean'
#      (deterministic stand-in for the phase-2 critic: it probes
#      the submission and reports clean only on pass - with no provider
#      key the live critic fail-closes the submission)
#      (the script is installed by install.sh and pairs with this exact run:
#      hairspring run --goal "write hello.txt containing hello" \
#          --config <this file> --dir /tmp/hs-demo)
#   2. comment out `default = true` on the deepseek model above and
#      uncomment the line below.
# Without HS_SEQMODEL_SCRIPT the model stays inert: missions that call it
# get an error naming the variable, other models are unaffected.
[[models]]
name = "scripted"
command = ["@PREFIX@/bin/hs-plugin-scripted"]
# default = true
subjects = ["*"]

# Mission caps: NONE unless declared (Eric 2026-09-12 - a fresh rig runs
# uncapped; set them in `hairspring setup` or live with /caps in the TUI).
# Uncomment to arm:
# [run]
# max_steps = 200        # step cap per mission
# wall_secs = 7200       # wall-clock cap per mission
# budget_usd = 100.0     # spend cap in dollars (always a float literal -
#                        # an integer here is the 2026-09-12 $100->$10 bug)
