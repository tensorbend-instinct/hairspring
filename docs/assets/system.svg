<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141413"/></marker>
  <marker id="clay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9602F"/></marker>
</defs>
<style>
  .h1{font:600 34px Georgia, 'Times New Roman', serif;fill:#141413}
  .sub{font-size:15px;fill:#6E6A61}
  .t{font-size:15.5px;font-weight:bold;fill:#141413}
  .ta{font-size:16.5px;font-weight:bold;fill:#141413}
  .s{font-size:11.5px;fill:#6E6A61}
  .lab{font-size:12px;fill:#141413}
  .chip{font-size:12px;font-weight:bold;fill:#FAF9F5}
  .leg{font-size:12px;fill:#3A3835}
  .foot{font-size:12px;fill:#6E6A61}
  .box{fill:#FFFFFF;stroke:#141413;stroke-width:1.2}
  .auth{fill:#FFFFFF;stroke:#C9602F;stroke-width:2.2}
  .big{font:600 30px Georgia, 'Times New Roman', serif;fill:#C9602F}
  .lt{font-size:17px;font-weight:bold;fill:#FAF9F5}
  .lb{font-size:12px;fill:#CFCBC2}
</style>

<rect width="1800" height="1060" fill="#FAF9F5"/>

<text x="70" y="72" class="h1">HAIRSPRING</text>
<text x="70" y="100" class="sub">The loop is a commodity - think, act, observe. The authority is the product: the checker closes, the critic refutes, the log is the state, the world validates, the scorer promotes.</text>

<!-- legend -->
<line x1="1230" y1="58" x2="1266" y2="58" stroke="#141413" stroke-width="1.6" marker-end="url(#ink)"/><text x="1276" y="62" class="leg">the work flows</text>
<line x1="1230" y1="82" x2="1266" y2="82" stroke="#C9602F" stroke-width="2.2" marker-end="url(#clay)"/><text x="1276" y="86" class="leg">authority decides</text>
<line x1="1430" y1="58" x2="1466" y2="58" stroke="#141413" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ink)"/><text x="1476" y="62" class="leg">recorded in the log</text>
<circle cx="1443" cy="80" r="9" fill="#141413"/><text x="1443" y="84" text-anchor="middle" class="chip">n</text><text x="1476" y="86" class="leg">reading order</text>

<!-- 1: user + terminal -->
<rect x="70" y="150" width="260" height="56" rx="6" class="box"/>
<text x="90" y="173" class="t">The user</text>
<text x="90" y="191" class="s">describes a job in plain language</text>
<rect x="70" y="252" width="260" height="62" rx="6" class="box"/>
<text x="90" y="276" class="t">The terminal app</text>
<text x="90" y="294" class="s">turns the job into a mission and</text>
<text x="90" y="309" class="s">shows it running, step by step</text>
<line x1="200" y1="206" x2="200" y2="246" stroke="#141413" stroke-width="1.4" marker-end="url(#ink)"/>
<circle cx="342" cy="284" r="10" fill="#141413"/><text x="342" y="288" text-anchor="middle" class="chip">1</text>
<line x1="330" y1="283" x2="470" y2="283" stroke="#141413" stroke-width="1.4" marker-end="url(#ink)"/>
<text x="360" y="272" class="lab">runs a mission</text>

<!-- 2: the loop (commodity) -->
<circle cx="470" cy="176" r="10" fill="#141413"/><text x="470" y="180" text-anchor="middle" class="chip">2</text>
<rect x="470" y="150" width="480" height="300" rx="10" fill="none" stroke="#141413" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="495" y="176" class="t">The loop - a commodity</text>
<text x="495" y="193" class="s">think, act, observe; the model works here</text>
<rect x="495" y="230" width="190" height="54" rx="6" class="box"/>
<text x="590" y="253" text-anchor="middle" class="t">1. Think</text>
<text x="590" y="271" text-anchor="middle" class="s">the model picks the next step</text>
<rect x="735" y="230" width="190" height="54" rx="6" class="box"/>
<text x="830" y="253" text-anchor="middle" class="t">2. Act</text>
<text x="830" y="271" text-anchor="middle" class="s">a tool runs: edit, run, search</text>
<rect x="615" y="340" width="190" height="54" rx="6" class="box"/>
<text x="710" y="363" text-anchor="middle" class="t">3. Observe</text>
<text x="710" y="381" text-anchor="middle" class="s">the result comes back</text>
<line x1="685" y1="257" x2="729" y2="257" stroke="#141413" stroke-width="1.6" marker-end="url(#ink)"/>
<path d="M 830 284 L 830 315 L 710 315 L 710 334" fill="none" stroke="#141413" stroke-width="1.6" marker-end="url(#ink)"/>
<path d="M 615 367 L 555 367 L 555 290 L 584 290" fill="none" stroke="#141413" stroke-width="1.6" marker-end="url(#ink)"/>
<text x="495" y="430" class="s">the loop repeats until the checker stops it -</text>
<text x="495" y="445" class="s">the model's say-so is not a verdict</text>

<!-- toolbox -->
<rect x="70" y="500" width="260" height="76" rx="6" class="box"/>
<text x="90" y="524" class="t">The toolbox</text>
<text x="90" y="543" class="s">edit files, run commands, read and</text>
<text x="90" y="559" class="s">search, spawn, submit</text>
<line x1="330" y1="538" x2="464" y2="400" stroke="#141413" stroke-width="1.2" marker-end="url(#ink)"/>

<!-- kernel note -->
<rect x="70" y="620" width="260" height="70" rx="6" class="box"/>
<text x="90" y="644" class="t">The wiring</text>
<text x="90" y="662" class="s">one config swaps the model: DeepSeek,</text>
<text x="90" y="677" class="s">GLM, any OpenAI-compatible API</text>

<!-- 3: checker -->
<rect x="1010" y="150" width="360" height="70" rx="6" class="auth"/>
<text x="1030" y="176" class="ta">The checker - closes</text>
<text x="1030" y="195" class="s">the mission's declared checks must pass;</text>
<text x="1030" y="210" class="s">the model cannot close its own mission</text>
<path d="M 950 240 L 985 240 L 985 195 L 1004 195" fill="none" stroke="#141413" stroke-width="1.6" marker-end="url(#ink)"/>
<text x="956" y="230" class="lab">submits</text>

<!-- 4: critic -->
<rect x="1010" y="270" width="360" height="76" rx="6" class="auth"/>
<text x="1030" y="296" class="ta">The critic - refutes</text>
<text x="1030" y="315" class="s">an independent model, fresh context, read-only</text>
<text x="1030" y="331" class="s">shell, one directive: prove the work wrong</text>
<line x1="1190" y1="220" x2="1190" y2="264" stroke="#C9602F" stroke-width="2.2" marker-end="url(#clay)"/>
<text x="1202" y="248" class="lab" fill="#C9602F">checks green</text>

<!-- 5: verdict -->
<rect x="1010" y="390" width="360" height="82" rx="6" class="auth"/>
<text x="1190" y="432" text-anchor="middle" class="big">VERIFIED</text>
<text x="1190" y="457" text-anchor="middle" class="s">checks green, critic could not refute - or it didn't happen</text>
<line x1="1190" y1="346" x2="1190" y2="384" stroke="#C9602F" stroke-width="2.2" marker-end="url(#clay)"/>

<!-- memory plane -->
<rect x="1430" y="150" width="300" height="76" rx="6" class="box"/>
<text x="1450" y="174" class="t">Memory - scores itself</text>
<text x="1450" y="193" class="s">cited by a later mission: +1</text>
<text x="1450" y="209" class="s">served and ignored: -1</text>

<!-- swarm -->
<rect x="1430" y="270" width="300" height="76" rx="6" class="box"/>
<text x="1450" y="294" class="t">Sub-agents - join</text>
<text x="1450" y="313" class="s">children run concurrently; the parent</text>
<text x="1450" y="329" class="s">may not pass before they join</text>

<!-- 6: self-mod -->
<rect x="1430" y="390" width="300" height="82" rx="6" class="auth"/>
<text x="1450" y="414" class="ta">The scorer - promotes</text>
<text x="1450" y="433" class="s">a forked self-modification ships when it</text>
<text x="1450" y="449" class="s">beats a pinned scorer on held-out assays,</text>
<text x="1450" y="465" class="s">else rewind</text>

<!-- 7: world -->
<rect x="1430" y="520" width="300" height="82" rx="6" class="auth"/>
<text x="1450" y="544" class="ta">The world - validates</text>
<text x="1450" y="563" class="s">agents propose; the world service alone</text>
<text x="1450" y="579" class="s">records what happened</text>

<!-- 8: the log spine -->
<rect x="70" y="730" width="1660" height="96" rx="8" fill="#141413"/>
<text x="100" y="770" class="lt">The log - the state</text>
<text x="100" y="792" class="lb">append-only and hash-chained, written by the loop alone. A crash at any point leaves consistent provenance; any mission rewinds and replays from the record.</text>
<text x="100" y="811" class="lb">The verdict, the refutation, the scores, the promotions - each lands here first.</text>

<!-- dashed record arrows down to the log -->
<line x1="710" y1="450" x2="710" y2="724" stroke="#141413" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ink)"/>
<line x1="1190" y1="472" x2="1190" y2="724" stroke="#141413" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ink)"/>
<line x1="1580" y1="602" x2="1580" y2="724" stroke="#141413" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ink)"/>
<line x1="200" y1="690" x2="200" y2="724" stroke="#141413" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ink)"/>

<!-- benchmark note -->
<rect x="70" y="880" width="420" height="70" rx="6" class="box"/>
<text x="90" y="904" class="t">The benchmark harness</text>
<text x="90" y="922" class="s">the loop is scored against coding benchmarks, end to end</text>
<line x1="280" y1="880" x2="280" y2="832" stroke="#141413" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#ink)"/>


<circle cx="1010" cy="185" r="10" fill="#C9602F"/><text x="1010" y="189" text-anchor="middle" class="chip">3</text>
<circle cx="1010" cy="308" r="10" fill="#C9602F"/><text x="1010" y="312" text-anchor="middle" class="chip">4</text>
<circle cx="1010" cy="431" r="10" fill="#C9602F"/><text x="1010" y="435" text-anchor="middle" class="chip">5</text>
<circle cx="1430" cy="431" r="10" fill="#C9602F"/><text x="1430" y="435" text-anchor="middle" class="chip">6</text>
<circle cx="1430" cy="561" r="10" fill="#C9602F"/><text x="1430" y="565" text-anchor="middle" class="chip">7</text>
<circle cx="70" cy="778" r="10" fill="#C9602F"/><text x="70" y="782" text-anchor="middle" class="chip">8</text>

<!-- footer -->
<text x="70" y="1000" class="foot">64,498 lines of Rust across 14 crates  -  918 tests, 0 failed  -  0 clippy warnings, pedantic  -  regenerate each number from the repo</text>
<text x="70" y="1022" class="foot">DeepSeek and GLM built in; any OpenAI-compatible endpoint by configuration  -  bubblewrap on Linux, Seatbelt on macOS</text>

</svg>
