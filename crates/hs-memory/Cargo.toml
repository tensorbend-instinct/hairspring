[package]
name = "hs-memory"
description = "HAIRSPRING D3: typed memory plane - one embedded store (SQLite WAL) behind a trait boundary"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
hs-core = { path = "../hs-core" }
hs-log = { path = "../hs-log" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
