[package]
name = "hs-goal"
description = "HAIRSPRING gate 4: outer loop - Goal Mode completion authority, budgets, async gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
hs-core = { path = "../hs-core" }
hs-log = { path = "../hs-log" }
hs-kernel = { path = "../hs-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
