[package]
name = "hs-swarm"
description = "HAIRSPRING gate 5: sub-agent spawner + swarm operators (child streams on the same substrate)"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "hs-plugin-swarm"
path = "src/bin/hs-plugin-swarm.rs"

[dependencies]
hs-core = { path = "../hs-core" }
hs-log = { path = "../hs-log" }
hs-kernel = { path = "../hs-kernel" }
hs-loop = { path = "../hs-loop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
