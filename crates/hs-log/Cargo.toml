[package]
name = "hs-log"
description = "HAIRSPRING gate 1: segmented append-only log, payload-by-hash store, verifier, replay"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
hs-core = { path = "../hs-core" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"

[dev-dependencies]
tempfile = "3"
