[package]
name = "hs-kernel"
description = "HAIRSPRING gate 2: plugin kernel (config-declared tool/model/rail plugins) + Rails dispatcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
hs-core = { path = "../hs-core" }
hs-log = { path = "../hs-log" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
