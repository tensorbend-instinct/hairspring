[package]
name = "hs-loop"
description = "HAIRSPRING gate 3: inner loop with semantic feedback (observe, drain, assemble, call, validate, submit)"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
hs-core = { path = "../hs-core" }
hs-log = { path = "../hs-log" }
hs-kernel = { path = "../hs-kernel" }
hs-bench = { path = "../hs-bench" }
hs-applypatch = { path = "../hs-applypatch" }
hs-hashline = { path = "../hs-hashline" }
hs-memory = { path = "../hs-memory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
tokio = { version = "1", features = ["rt", "process", "io-std", "macros"] }
rmcp = { version = "0.6", features = ["client", "server", "transport-child-process", "transport-io"] }
ignore = "0.4"
rustyline = "14"
ratatui = "0.30.2"
crossterm = "0.29.0"

[dev-dependencies]
tempfile = "3"
