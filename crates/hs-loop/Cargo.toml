[package]
name = "hs-loop"
description = "HAIRSPRING gate 3: inner loop with semantic feedback (observe, drain, assemble, call, validate, submit)"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
hs-core = { path = "../hs-core" }
hs-log = { path = "../hs-log" }
hs-kernel = { path = "../hs-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
