[package]
name = "hs-selfmod"
description = "HAIRSPRING gate 8 (self-mod half): policy-layer mutation loop - fork, quarantine, pin, assay, soak, promote/rewind"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
hs-core = { path = "../hs-core" }
hs-log = { path = "../hs-log" }
hs-world = { path = "../hs-world" }
hs-scorer = { path = "../hs-scorer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
