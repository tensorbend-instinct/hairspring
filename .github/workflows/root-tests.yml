name: root-tests
# Runs the tests that need REAL root (critic_shell_red: setuid nobody on
# root-owned files; repexec_sandbox_red: /root, bwrap) natively on a
# GitHub-hosted runner. Manual only (workflow_dispatch): no PR triggers,
# no secrets used, read-only token, logs uploaded as artifacts.
on:
  workflow_dispatch:
  push:
    branches: [ci-root-tests]
permissions:
  contents: read
jobs:
  root-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap python3 python3-venv git build-essential pkg-config libssl-dev
          python3 -m pip install --user --break-system-packages uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version; id -u; sudo id -u
      - name: Build workspace bins (plugins must exist before tests)
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: cargo build --workspace --bins
      - name: critic_shell_red + repexec_sandbox_red as root
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: |
          mkdir -p out
          for t in critic_shell_red repexec_sandbox_red; do
            # build as the runner user, run the test binary itself as real root
            bin=$(cargo test -p hs-loop --test "$t" --no-run --message-format=json 2>out/build-$t.err \
              | jq -r --arg t "$t" 'select(.executable != null and .target.name == $t) | .executable' | tail -1)
            echo "binary for $t: $bin"
            (cd crates/hs-loop && sudo -E env "PATH=$PATH" "$bin" 2>&1 | tee "../../out/$t.log") || true
          done
          echo "::notice title=root-test-results::$(grep -hE 'test result|FAILED|panicked|id -u' out/*.log | head -20 | tr '\n' ' ')"
          echo "::notice title=root-test-build::$(tail -3 out/build-*.err | tr '\n' ' ' | cut -c1-600)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-test-logs
          path: out/
