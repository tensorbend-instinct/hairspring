# Install regression gate: run the EXACT public install path
# (clone -> ./install.sh) on the oldest supported stable toolchain and on
# latest stable, on Linux and macOS. Motivation (2026-09-10): a
# Duration::from_mins call compiled on the dev box's newer stable but
# failed a user's older stable at install time - nothing built the
# install path anywhere but the dev box.
name: install-gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain: ["1.88.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (${{ matrix.toolchain }})
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Public install path (exact)
        run: ./install.sh
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      - name: Smoke
        run: "$HOME/.local/bin/hairspring --help >/dev/null"
      # First-run mission smoke: the README's zero-network offline trial,
      # verbatim, on a HOME the workflow just installed into. Motivation
      # (2026-09-10): the trial was broken as documented for a real user -
      # the phase-2 critic fail-closed with no key and the verifier audit
      # needed prompt-aware mode. A green --help never exercised a mission.
      - name: Install bubblewrap (mission sandbox, Linux legs)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Missions confine every tool call BY MECHANISM on both platforms:
      # bubblewrap on Linux (installed above), kernel Seatbelt via
      # sandbox-exec on macOS (ships with the OS). The smoke exercises
      # the platform backend on every leg.
      - name: First-run mission smoke (offline trial, README verbatim)
        run: |
          set -euo pipefail
          export HS_SEQMODEL_SCRIPT="$HOME/.local/share/hairspring/seqmodel-demo.jsonl"
          export HS_SCRIPTED_PROMPT_AWARE=1
          export HS_CRITIC_SCRIPT='tool:grep -q hello hello.txt|clean'
          cfg="$HOME/.config/hairspring/hairspring.toml"
          # README step: make the scripted model the default (uncomment
          # its marker, comment deepseek's). Portable sed/awk only -
          # no GNU-only sed -i or 0,/re/ on the macOS runner.
          sed 's/^# default = true$/default = true/' "$cfg" > "$cfg.tmp" && mv "$cfg.tmp" "$cfg"
          awk '/^default = true$/ && !done { print "# default = true"; done=1; next } { print }' "$cfg" > "$cfg.tmp" && mv "$cfg.tmp" "$cfg"
          rm -rf /tmp/hs-demo
          "$HOME/.local/bin/hairspring" run --goal "write hello.txt containing hello" \
            --config "$cfg" --dir /tmp/hs-demo
          test -f /tmp/hs-demo/work/write-hello-txt-containing-hello/answer.txt
          strings /tmp/hs-demo/streams/*/seg-000000.hslog | grep -q '"outcome":"verified"'
      # Hostile confinement proof on the platform backend: project-root
      # boundary, env scrub, verifier read-only parity (Linux bwrap /
      # macOS seatbelt).
      - name: Hostile confinement tests (platform backend)
        run: cargo test --release --locked -p hs-loop --test seatbelt_profile_red
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
